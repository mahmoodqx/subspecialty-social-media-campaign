<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 1080px;
      height: 1080px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #ffffff;
      color: #1a1a1a;
      padding: 50px;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 35px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
    }

    .logo-text {
      font-size: 26px;
      font-weight: 700;
      color: #1a1a1a;
      letter-spacing: -0.5px;
    }

    .badge {
      background: #f0fdf4;
      border: 1.5px solid #22c55e;
      color: #16a34a;
      padding: 10px 20px;
      border-radius: 25px;
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Category Tag */
    .category {
      display: inline-block;
      background: #f3f4f6;
      color: #6b7280;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 28px;
    }

    /* Question */
    .question-stem {
      font-size: 23px;
      font-weight: 400;
      line-height: 1.55;
      color: #1a1a1a;
      margin-bottom: 35px;
    }

    /* Options */
    .options {
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex-grow: 1;
    }

    .option {
      display: flex;
      align-items: center;
      background: #ffffff;
      border: 1.5px solid #e5e7eb;
      border-radius: 12px;
      padding: 22px 24px;
    }

    .option-letter {
      font-weight: 600;
      font-size: 18px;
      color: #374151;
      margin-right: 14px;
      min-width: 28px;
    }

    .option-text {
      font-size: 18px;
      font-weight: 400;
      color: #374151;
      line-height: 1.4;
    }

    /* Footer */
    .footer {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 30px;
      border-top: 1px solid #e5e7eb;
    }

    .footer-logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .footer-logo-icon {
      width: 24px;
      height: 24px;
    }

    .footer-logo-text {
      font-size: 18px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .engagement {
      font-size: 18px;
      font-weight: 600;
      color: #1a1a1a;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">
      <svg class="logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="2 0 22 23" width="32" height="32">
        <circle cx="7.5" cy="3.5" r="2.5" fill="none" stroke="#000000" stroke-width="2"/>
        <circle cx="7.5" cy="11.5" r="3.5" fill="#000000"/>
        <circle cx="7.5" cy="19.5" r="3.5" fill="#000000"/>
        <circle cx="16.5" cy="3.5" r="3.5" fill="#000000"/>
        <circle cx="16.5" cy="11.5" r="2.5" fill="none" stroke="#000000" stroke-width="2"/>
        <circle cx="16.5" cy="19.5" r="2.5" fill="none" stroke="#000000" stroke-width="2"/>
      </svg>
      <span class="logo-text">Subspecialty</span>
    </div>
    <div class="badge">Question of the Day</div>
  </div>

  <div class="category">{{category}}</div>

  <div class="question-stem">{{question_stem}}</div>

  <div class="options">
    <div class="option">
      <span class="option-letter">A.</span>
      <span class="option-text">{{option_a}}</span>
    </div>
    <div class="option">
      <span class="option-letter">B.</span>
      <span class="option-text">{{option_b}}</span>
    </div>
    <div class="option">
      <span class="option-letter">C.</span>
      <span class="option-text">{{option_c}}</span>
    </div>
    <div class="option">
      <span class="option-letter">D.</span>
      <span class="option-text">{{option_d}}</span>
    </div>
  </div>

  <div class="footer">
    <div class="footer-logo">
      <svg class="footer-logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="2 0 22 23" width="24" height="24">
        <circle cx="7.5" cy="3.5" r="2.5" fill="none" stroke="#000000" stroke-width="2"/>
        <circle cx="7.5" cy="11.5" r="3.5" fill="#000000"/>
        <circle cx="7.5" cy="19.5" r="3.5" fill="#000000"/>
        <circle cx="16.5" cy="3.5" r="3.5" fill="#000000"/>
        <circle cx="16.5" cy="11.5" r="2.5" fill="none" stroke="#000000" stroke-width="2"/>
        <circle cx="16.5" cy="19.5" r="2.5" fill="none" stroke="#000000" stroke-width="2"/>
      </svg>
      <span class="footer-logo-text">Subspecialty</span>
    </div>
    <div class="engagement">Drop your answer below 👇</div>
  </div>

</body>
</html>
